server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # This Nginx is the public edge. Replace, never append, client-supplied IP headers.
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-By "";
    proxy_set_header X-Forwarded-Ssl "";

    location /api/ {
        proxy_pass http://backend:8080;
    }
    location ~ ^/actuator/(health(/(liveness|readiness))?|metrics(/[^/]+)?)$ {
        proxy_pass http://backend:8080;
    }
    location /actuator/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
