spring:
  application:
    name: courseflow
  transaction:
    default-timeout: ${DB_TRANSACTION_TIMEOUT:30s}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.courseflow: ${COURSEFLOW_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${COURSEFLOW_SQL_LOG_LEVEL:OFF}
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
