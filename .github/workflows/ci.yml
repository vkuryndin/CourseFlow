name: CourseFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_to_aws:
        description: Deploy latest images to AWS only (skip CI)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

# Keep publication and deployment of latest images in the same serialized run.
concurrency:
  group: courseflow-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_to_aws }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit tests, architecture and code quality
        run: bash ./gradlew --no-daemon test spotlessCheck spotbugsMain checkstyleMain
      - name: Integration tests (PostgreSQL Testcontainers)
        run: bash ./gradlew --no-daemon integrationTest
      - name: Build executable JAR
        run: bash ./gradlew --no-daemon bootJar
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-reports
          path: build/reports/
          if-no-files-found: warn
      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: backend-jar
          path: build/libs/*.jar
          if-no-files-found: error

  frontend:
    name: Frontend
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_to_aws }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and architecture tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  publish-images:
    name: Publish Docker images (GHCR)
    needs: [backend, frontend]
    concurrency:
      group: courseflow-publish-images
      cancel-in-progress: false
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.deploy_to_aws)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: backend-jar
          path: build/libs
      - uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build and publish images
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          backend="${prefix}-backend:${GITHUB_SHA}"
          frontend="${prefix}-frontend:${GITHUB_SHA}"
          source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          docker build --label "org.opencontainers.image.source=${source}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$backend" .
          docker build --label "org.opencontainers.image.source=${source}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$frontend" frontend
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker push "$backend"
          docker push "$frontend"
          master_head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$master_head" != "$GITHUB_SHA" ]; then
            echo "Master has advanced; refusing to replace latest with an older revision." >&2
            exit 1
          fi
          docker tag "$backend" "${prefix}-backend:latest"
          docker tag "$frontend" "${prefix}-frontend:latest"
          docker push "${prefix}-backend:latest"
          docker push "${prefix}-frontend:latest"
          printf '### Published Docker images\n- `%s`\n- `%s`\n' "$backend" "$frontend" >> "$GITHUB_STEP_SUMMARY"

  deploy-aws:
    name: Deploy to AWS
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.deploy_to_aws }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Update CourseFlow and verify health
        shell: bash
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${AWS_HOST:?Missing AWS_HOST}" "${AWS_SSH_KEY:?Missing AWS_SSH_KEY}" "${AWS_SSH_KNOWN_HOSTS:?Missing AWS_SSH_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$AWS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -F /dev/null \
            -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "ubuntu@$AWS_HOST" "bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/courseflow"
          # Resolve the latest published pair, not the current (possibly untested) master HEAD.
          docker pull ghcr.io/vkuryndin/courseflow-backend:latest
          docker pull ghcr.io/vkuryndin/courseflow-frontend:latest
          revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ghcr.io/vkuryndin/courseflow-backend:latest)
          frontend_revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ghcr.io/vkuryndin/courseflow-frontend:latest)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing or invalid backend revision" >&2; exit 1; }
          test "$frontend_revision" = "$revision" || { echo "Latest image revisions do not match" >&2; exit 1; }
          git fetch origin master
          git merge-base --is-ancestor "$revision" origin/master
          git merge --ff-only "$revision"
          test "$(git rev-parse HEAD)" = "$revision"
          docker compose -p courseflow config --quiet
          # Do not recreate PostgreSQL or touch Hotel Booking.
          docker compose -p courseflow up -d --no-deps --no-build --pull never --wait --wait-timeout 600 backend
          docker compose -p courseflow up -d --no-deps --no-build --pull never --wait --wait-timeout 240 frontend
          docker compose -p courseflow ps
          REMOTE
