name: CourseFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courseflow-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit tests, architecture and code quality
        run: bash ./gradlew --no-daemon test spotlessCheck spotbugsMain checkstyleMain
      - name: Integration tests (PostgreSQL Testcontainers)
        run: bash ./gradlew --no-daemon integrationTest
      - name: Build executable JAR
        run: bash ./gradlew --no-daemon bootJar
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-reports
          path: build/reports/
          if-no-files-found: warn
      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: backend-jar
          path: build/libs/*.jar
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release version
        run: node scripts/sync-version.mjs --check
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and architecture tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  publish-images:
    name: Publish Docker images (GHCR)
    needs: [backend, frontend]
    concurrency:
      group: courseflow-publish-images
      cancel-in-progress: false
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: backend-jar
          path: build/libs
      - uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build and publish images
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          backend="${prefix}-backend:${GITHUB_SHA}"
          frontend="${prefix}-frontend:${GITHUB_SHA}"
          source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          docker build --label "org.opencontainers.image.source=${source}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$backend" .
          docker build --label "org.opencontainers.image.source=${source}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$frontend" frontend
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker push "$backend"
          docker push "$frontend"
          master_head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$master_head" != "$GITHUB_SHA" ]; then
            echo "Master has advanced; refusing to replace latest with an older revision." >&2
            exit 1
          fi
          docker tag "$backend" "${prefix}-backend:${version}"
          docker tag "$frontend" "${prefix}-frontend:${version}"
          docker push "${prefix}-backend:${version}"
          docker push "${prefix}-frontend:${version}"
          docker tag "$backend" "${prefix}-backend:latest"
          docker tag "$frontend" "${prefix}-frontend:latest"
          docker push "${prefix}-backend:latest"
          docker push "${prefix}-frontend:latest"
          printf '### Published Docker images — %s\n- `%s`\n- `%s`\n- Tags: `%s`, `latest`, commit SHA\n' "$version" "$backend" "$frontend" "$version" >> "$GITHUB_STEP_SUMMARY"
      - name: Download JaCoCo report
        uses: actions/download-artifact@v6
        with:
          name: backend-reports
          path: build/reports
      - name: Update coverage badges
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          badge_dir=$(mktemp -d)
          trap 'rm -rf "$badge_dir"' EXIT
          # Authenticate only this step, without saving credentials in the repository.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git -C "$badge_dir" init --initial-branch=badges
          git -C "$badge_dir" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if git -C "$badge_dir" ls-remote --exit-code origin refs/heads/badges; then
            git -C "$badge_dir" fetch --no-tags origin refs/heads/badges
            git -C "$badge_dir" switch -C badges FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          fi
          python3 .github/scripts/update-badges.py \
            build/reports/jacoco/test/jacocoTestReport.xml "$badge_dir"
          git -C "$badge_dir" add line-coverage.json branch-coverage.json
          if git -C "$badge_dir" diff --cached --quiet; then
            echo "Coverage badges are already up to date."
          else
            git -C "$badge_dir" config user.name 'github-actions[bot]'
            git -C "$badge_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$badge_dir" commit -m "Update coverage badges for $GITHUB_SHA"
            git -C "$badge_dir" push origin HEAD:refs/heads/badges
          fi
